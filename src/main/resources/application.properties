# ═══════════════════════════════════════════════════════
#   Matcha Box — application.properties
# ═══════════════════════════════════════════════════════

server.port=8080

# ── MySQL — update username/password to match yours ──
spring.datasource.url=jdbc:mysql://localhost:3306/matchabox?useSSL=false&serverTimezone=Asia/Kuala_Lumpur&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ── Static files (serves HTML/CSS/JS) ──
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ── Jackson JSON ──
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=Asia/Kuala_Lumpur

# ── File upload ──
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB

# ── Logging ──
logging.level.root=INFO
logging.level.com.matchabox=DEBUG

# ── App settings ──
app.name=Matcha Box
app.currency=RM
app.loyalty.points-per-order=1
app.loyalty.points-for-free-drink=10
app.order.service-charge-percent=6
